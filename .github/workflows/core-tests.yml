name: core-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test engine-free core
        run: dotnet test Tests/CoreTests/Hollowcrawl.Core.Tests.csproj --nologo
